services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    command: ["/opt/kafka/bin/kafka-server-start.sh", "/etc/kafka/server.properties"]
    volumes:
      - ./kafka/server.properties:/etc/kafka/server.properties:ro
      - ./security/certs:/etc/kafka/secrets:ro

  generator_1:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.9-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        CMD ["python", "generator/iso_streamer_1.py"]
    container_name: node_generator_1
    depends_on:
      - kafka
    volumes:
      - .:/app

  generator_2:
      build:
        context: .
        dockerfile_inline: |
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "generator/iso_streamer_2.py"]
      container_name: node_generator_2
      depends_on:
        - kafka
      volumes:
        - .:/app

  generator_3:
      build:
        context: .
        dockerfile_inline: |
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "generator/iso_streamer_3.py"]
      container_name: node_generator_3
      depends_on:
        - kafka
      volumes:
        - .:/app
  generator_4:
      build:
        context: .
        dockerfile_inline: |
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "generator/iso_streamer_4.py"]
      container_name: node_generator_4
      depends_on:
        - kafka
      volumes:
        - .:/app
  
  ingestion_processor_1:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.9-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        CMD ["python", "ingestion/ingestion_1.py"]
    container_name: node_ingestion_1
    depends_on:
      - kafka
    volumes:
      - .:/app

  ingestion_processor_2:
      build:
        context: .
        dockerfile_inline: |
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "ingestion/ingestion_2.py"]
      container_name: node_ingestion_2
      depends_on:
        - kafka
      volumes:
        - .:/app

  ingestion_processor_3:
      build:
        context: .
        dockerfile_inline: |
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "ingestion/ingestion_3.py"]
      container_name: node_ingestion_3
