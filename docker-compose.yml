  flower_server:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.9-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        CMD ["python", "federated/server.py"]
    container_name: fl_aggregator
    ports:
      - "8080:8080"
    volumes:
      - ./security/certs:/app/certs:ro
  