version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      # Montage des certificats mTLS générés localement vers le conteneur Kafka
      - ./security/certs:/etc/kafka/secrets:ro
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SSL:SSL
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,SSL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,SSL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # Configuration SSL / mTLS (utilisation des fichiers PEM supportés depuis Kafka 2.7+)
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_CERTIFICATE_CHAIN: /etc/kafka/secrets/server.crt
      KAFKA_SSL_KEYSTORE_KEY: /etc/kafka/secrets/server.key
      
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_CERTIFICATES: /etc/kafka/secrets/ca.crt
      
      # Exigence du certificat client (Client Authentication mTLS obligatoire)
      KAFKA_SSL_CLIENT_AUTH: required

      # Création automatique du topic (Générateur -> Ingestion)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
