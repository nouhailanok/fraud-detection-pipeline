# ============================================================================
# Volumes
# ============================================================================
volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  prometheus-data:
  grafana-data:

# ============================================================================
# Réseau
# ============================================================================
networks:
  node_network:
    name: ${COMPOSE_PROJECT_NAME:-fraud_detection_node}_network
    driver: bridge