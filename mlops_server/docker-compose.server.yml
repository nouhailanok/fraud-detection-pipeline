# ============================================================================
# docker-compose.server.yml — Flower Server Monitoring Stack
# ============================================================================
# Deploy this file on the AWS Flower server host.
# It monitors:
#   - Flower server runtime metrics endpoint
#   - FL run artifacts (fl_metrics.json, behavioral_analysis.json)
#   - model_registry status (production model, score, trust)
#   - host/container resources
# ============================================================================

name: fraud-detection-server

services:
  flower_state_exporter:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        RUN pip install --no-cache-dir prometheus-client
        CMD ["python", "monitoring/fl_metrics_exporter.py"]
    container_name: ${COMPOSE_PROJECT_NAME:-fl-server}-state-exporter
    restart: unless-stopped
    environment:
      FL_RUNS_DIR: /logs/runs
      FL_REGISTRY_FILE: /app/model_registry/registry.json
      FL_BEST_MODEL_META: /app/model_registry/best_model/metadata.json
      FL_EXPORTER_POLL_SECONDS: ${FL_EXPORTER_POLL_SECONDS:-15}
      FL_EXPORTER_PORT: ${FL_EXPORTER_PORT:-9108}
    volumes:
      - .:/app:ro
      - ../logs:/logs:ro
    ports:
      - "127.0.0.1:${FL_EXPORTER_PORT:-9108}:9108"
    networks:
      - server_network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ${COMPOSE_PROJECT_NAME:-fl-server}-prometheus
    restart: unless-stopped
    depends_on:
      - flower_state_exporter
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-server-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:${SERVER_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - server_network

  grafana:
    image: grafana/grafana:10.4.3
    container_name: ${COMPOSE_PROJECT_NAME:-fl-server}-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${SERVER_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SERVER_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${SERVER_GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-server-data:/var/lib/grafana
    ports:
      - "0.0.0.0:${SERVER_GRAFANA_PORT:-3000}:3000"
    networks:
      - server_network

volumes:
  prometheus-server-data:
  grafana-server-data:

networks:
  server_network:
    name: ${COMPOSE_PROJECT_NAME:-fraud_detection_server}_network
    driver: bridge
